[package]
name = "axionomy-video"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axionomy = { path = ".." }
axionomy-engine = { path = "../crates/axionomy-engine" }
axionomy-problems = { path = "../crates/axionomy-problems", features = ["packages"] }
axionomy-rl = { path = "../crates/axionomy-rl" }
axionomy-store = { path = "../crates/axionomy-store" }
fframes = { git = "https://github.com/dmtrKovalenko/fframes", rev = "49b76066abbc95f5c77ce7755f478e0bfcefc9f2", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { git = "https://github.com/dmtrKovalenko/fframes", rev = "49b76066abbc95f5c77ce7755f478e0bfcefc9f2", features = ["metal"] }
fframes_native_player = { git = "https://github.com/dmtrKovalenko/fframes", rev = "49b76066abbc95f5c77ce7755f478e0bfcefc9f2", default-features = false, features = ["metal", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { git = "https://github.com/dmtrKovalenko/fframes", rev = "49b76066abbc95f5c77ce7755f478e0bfcefc9f2", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "axionomy_video"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "axionomy-video"
path = "src/main.rs"

# fframes builds Skia and ffmpeg, so the video is its own workspace: the root
# workspace excludes it, and nothing else pays for it.
[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

