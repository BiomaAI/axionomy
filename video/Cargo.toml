[package]
name = "axionomy-video"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axionomy = { path = ".." }
axionomy-engine = { path = "../crates/axionomy-engine" }
axionomy-problems = { path = "../crates/axionomy-problems", features = ["packages"] }
axionomy-rl = { path = "../crates/axionomy-rl" }
axionomy-store = { path = "../crates/axionomy-store" }
fframes = { version = "=1.4.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.4.0", features = ["metal"] }
fframes_native_player = { version = "=1.4.0", default-features = false, features = ["metal", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.4.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "axionomy_video"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "axionomy-video"
path = "src/main.rs"

# fframes builds Skia and ffmpeg, so the video is its own workspace: the root
# workspace excludes it, and nothing else pays for it.
[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

