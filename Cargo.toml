[workspace]
members = [
    ".",
    "crates/axionomy-derive",
    "crates/axionomy-search",
    "crates/axionomy-problems",
    "crates/axionomy-units",
    "crates/axionomy-time",
    "crates/axionomy-tree",
    "crates/axionomy-store",
    "crates/axionomy-mcp",
    "crates/axionomy-view",
    "crates/axionomy-study",
    "crates/axionomy-cli",
    "crates/axionomy-studio-server",
    "crates/axionomy-studio-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Alex Rozgo <alex.rozgo@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/BiomaAI/axionomy"
rust-version = "1.99"

# One version for every crate. Floors are the locked, tested versions; members
# add only the features they use. Optional dependencies are declared optional
# by the member that owns the feature, never here.
[workspace.dependencies]
axionomy = { version = "0.1.0", path = "." }
axionomy-derive = { version = "0.1.0", path = "crates/axionomy-derive" }
axionomy-problems = { version = "0.1.0", path = "crates/axionomy-problems" }
axionomy-search = { version = "0.1.0", path = "crates/axionomy-search" }
axionomy-tree = { version = "0.1.0", path = "crates/axionomy-tree" }
axionomy-study = { version = "0.1.0", path = "crates/axionomy-study" }
axionomy-store = { version = "0.1.0", path = "crates/axionomy-store" }
axionomy-units = { version = "0.1.0", path = "crates/axionomy-units" }
axionomy-view = { version = "0.1.0", path = "crates/axionomy-view" }

axum = "0.8.9"
blake3 = "1.8.7"
getrandom = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.8.2"
futures-util = "0.3.34"
http-body-util = "0.1.5"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.41", features = ["serde"] }
js-sys = "0.3.107"
num-rational = { version = "0.4.2", features = ["serde"] }
num-traits = "0.2.19"
pathfinding = "4.16.0"
proc-macro2 = "1.0.107"
proptest = "1.12.0"
quote = "1.0.47"
rand = { version = "0.10.3", default-features = false, features = ["std"] }
rand_chacha = "0.10.0"
redb = "4.5.0"
ruint = { version = "1.21.1", default-features = false, features = ["std"] }
rmcp = { version = "3.9.0", default-features = false, features = [
    "macros",
    "request-state",
    "server",
    "transport-streamable-http-server",
] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
statrs = { version = "0.19.1", default-features = false, features = ["std"] }
syn = "2.0.119"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uom = { version = "0.38.0", default-features = false, features = [
    "autoconvert",
    "rational64",
    "serde",
    "si",
    "std",
] }
wasm-bindgen = "0.2.130"

[package]
name = "axionomy"
description = "Closed economic state-machine primitives for verifiable problem solving"
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axionomy-derive.workspace = true
indexmap.workspace = true
ruint.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["rc"] }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lib]
name = "axionomy"
path = "src/lib.rs"

[[bench]]
name = "economy"
harness = false
