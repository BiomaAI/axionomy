[workspace]
members = [
    ".",
    "crates/axionomy-search",
    "crates/axionomy-problems",
    "crates/axionomy-units",
    "crates/axionomy-time",
    "crates/axionomy-mcp",
    "crates/axionomy-view",
    "crates/axionomy-service",
    "crates/axionomy-cli",
    "crates/axionomy-studio-server",
]
resolver = "3"

[workspace.package]
license = "MIT"

[package]
name = "axionomy"
version = "0.1.0"
authors = ["Alex Rozgo <alex.rozgo@gmail.com>"]
description = "Closed economic state-machine primitives for verifiable problem solving"
edition = "2024"
license.workspace = true
readme = "README.md"
repository = "https://github.com/BiomaAI/axionomy"
rust-version = "1.89"

[features]
default = []
bigint = ["dep:num-bigint"]

[dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
num-bigint = { version = "0.5.1", features = ["serde"], optional = true }
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive", "rc"] }
schemars = "1.2.2"
thiserror = "2.0.19"

[dev-dependencies]
criterion = "0.8.2"
num-bigint = { version = "0.5.1", features = ["serde"] }
proptest = "1.11.0"
serde_json = "1.0.149"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "axionomy"
path = "src/lib.rs"

[[bench]]
name = "economy"
harness = false

[[example]]
name = "bigint"
required-features = ["bigint"]
