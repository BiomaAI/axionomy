[package]
name = "axionomy-store"
description = "Runs, states and their organization for Axionomy, stored in redb"
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axionomy.workspace = true
axionomy-tree.workspace = true
blake3.workspace = true
getrandom.workspace = true
postcard.workspace = true
redb.workspace = true
serde.workspace = true
thiserror.workspace = true

# Without an operating system, randomness for a new store's prefix comes from
# the browser's `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "record"
harness = false
