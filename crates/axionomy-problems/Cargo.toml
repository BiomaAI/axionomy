[package]
name = "axionomy-problems"
description = "Sample problems for Axionomy: their encodings, conformance models, studies and presentations"
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The samples' package builders, which write through the engine.
packages = ["dep:axionomy-engine", "dep:axionomy-store", "dep:postcard"]

[dependencies]
axionomy.workspace = true
axionomy-engine = { workspace = true, optional = true }
axionomy-search.workspace = true
axionomy-store = { workspace = true, optional = true }
axionomy-study.workspace = true
axionomy-view.workspace = true
postcard = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
axionomy-engine.workspace = true
axionomy-store.workspace = true
postcard.workspace = true
criterion.workspace = true
proptest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "rollout_throughput"
harness = false
