[package]
name = "axionomy-problems"
version = "0.1.0"
authors = ["Alex Rozgo <alex.rozgo@gmail.com>"]
description = "Canonical problem encodings and conformance models for Axionomy"
edition = "2024"
license.workspace = true
readme = "README.md"
repository = "https://github.com/BiomaAI/axionomy"
rust-version = "1.89"

[dependencies]
axionomy = { version = "0.1.0", path = "../.." }
axionomy-search = { version = "0.1.0", path = "../axionomy-search" }
axionomy-view = { version = "0.1.0", path = "../axionomy-view" }
thiserror = "2.0.19"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "rollout_throughput"
harness = false
