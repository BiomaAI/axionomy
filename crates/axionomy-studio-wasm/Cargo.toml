[package]
name = "axionomy-studio-wasm"
version = "0.1.0"
authors = ["Alex Rozgo <alex.rozgo@gmail.com>"]
description = "Web Worker engine adapter for Axionomy Studio"
edition = "2024"
license.workspace = true
repository = "https://github.com/BiomaAI/axionomy"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axionomy-service = { version = "0.1.0", path = "../axionomy-service" }
axionomy-view = { version = "0.1.0", path = "../axionomy-view" }
js-sys = "0.3.83"
serde_json = "1.0.151"
wasm-bindgen = "0.2.106"
