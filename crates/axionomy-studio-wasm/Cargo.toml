[package]
name = "axionomy-studio-wasm"
description = "Web Worker engine adapter for Axionomy Studio"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axionomy-engine.workspace = true
axionomy-problems.workspace = true
axionomy-store.workspace = true
axionomy-study.workspace = true
axionomy-view.workspace = true
js-sys.workspace = true
postcard.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
# The origin private file system's synchronous access handle, which keeps the
# Worker's store across reloads.
web-sys = { workspace = true, features = [
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
] }

[dev-dependencies]
axionomy.workspace = true
axionomy-problems = { workspace = true, features = ["packages"] }
