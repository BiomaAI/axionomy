[package]
name = "axionomy-studio-server"
version = "0.1.0"
authors = ["Alex Rozgo <alex.rozgo@gmail.com>"]
description = "HTTP and event-stream reference server for Axionomy Studio"
edition = "2024"
license.workspace = true
readme = "README.md"
repository = "https://github.com/BiomaAI/axionomy"
rust-version = "1.89"

[dependencies]
# Aide 0.15 uses Schemars 0.9. Pin the first Schemars 1-native line so the
# repository keeps a single authoritative schema implementation.
aide = { version = "=0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query"] }
axionomy-problems = { version = "0.1.0", path = "../axionomy-problems" }
axionomy-view = { version = "0.1.0", path = "../axionomy-view" }
axum = "0.8.9"
futures-util = "0.3.32"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
