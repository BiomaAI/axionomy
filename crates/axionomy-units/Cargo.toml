[package]
name = "axionomy-units"
version = "0.1.0"
authors = ["Alex Rozgo <alex.rozgo@gmail.com>"]
description = "Dimension-safe physical quantity bindings for Axionomy assets"
edition = "2024"
readme = "README.md"
repository = "https://github.com/BiomaAI/axionomy"
rust-version = "1.89"

[dependencies]
axionomy = { version = "0.1.0", path = "../.." }
indexmap = { version = "2.14.0", features = ["serde"] }
num-rational = { version = "0.4.2", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
uom = { version = "0.38.0", default-features = false, features = [
    "autoconvert",
    "rational64",
    "serde",
    "si",
    "std",
] }

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.149"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1.0.116"
