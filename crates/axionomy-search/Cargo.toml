[package]
name = "axionomy-search"
version = "0.1.0"
authors = ["Alex Rozgo <alex.rozgo@gmail.com>"]
description = "Reference search strategies over closed Axionomy economies"
edition = "2024"
license.workspace = true
readme = "README.md"
repository = "https://github.com/BiomaAI/axionomy"
rust-version = "1.89"

[features]
default = []
bigint = ["axionomy/bigint"]

[dependencies]
axionomy = { version = "0.1.0", path = "../.." }
pathfinding = "4.15.0"
rand = "0.10.2"
rand_chacha = "0.10.0"
statrs = { version = "0.19.0", default-features = false, features = ["std"] }
thiserror = "2.0.19"

[dev-dependencies]
num-bigint = "0.5.1"
