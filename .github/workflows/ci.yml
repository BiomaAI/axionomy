name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked --version 0.13.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      - run: pnpm check:contracts
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - run: pnpm test:ui
        working-directory: studio
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: studio
      - run: pnpm test:e2e
        working-directory: studio
      - run: pnpm test:e2e:wasm
        working-directory: studio
