name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Fixtures are exactly what the specification generates
        working-directory: verification/lean
        run: |
          lake exe conformance > ../conformance.json
          git diff --exit-code -- ../conformance.json

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --workspace --doc --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      - run: pnpm check:contracts
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - run: pnpm test:ui
        working-directory: studio
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: studio
      - run: pnpm test:e2e
        working-directory: studio
      - run: pnpm test:e2e:wasm
        working-directory: studio
      # The Pages bundle reuses the WASM engine built above.
      - name: Build the Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: studio
        env:
          VITE_AXIONOMY_BASE: /axionomy/
          VITE_AXIONOMY_ENGINE: browser
        run: |
          pnpm build:ui
          test -f dist/index.html
          test -f dist/.nojekyll
          find dist/assets -name '*.wasm' -size +100k | grep -q .
          grep -q '/axionomy/' dist/index.html
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: studio/dist

  # Deploy only what passed every check.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [spec, rust, studio]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
