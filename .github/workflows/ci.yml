name: CI

on:
  push:
  pull_request:

jobs:
  proofs:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "2"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: verification/.tools
          key: aeneas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/aeneas-toolchain.json', 'scripts/setup_aeneas.py') }}
      - name: Install pinned Aeneas and Charon
        run: python3 scripts/setup_aeneas.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Check Rust extraction, Lean proofs, coverage, and conformance
        run: python3 scripts/check_proofs.py
      - name: Verify that the proof gate rejects invalid evidence
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked --version 0.15.0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      - run: pnpm check:contracts
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - run: pnpm test:ui
        working-directory: studio
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: studio
      - run: pnpm test:e2e
        working-directory: studio
      - run: pnpm test:e2e:wasm
        working-directory: studio
