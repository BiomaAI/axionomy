name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pinned toolchain is cached, so most runs download nothing.
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('verification/lean/lean-toolchain') }}
      - name: Install the pinned Lean toolchain
        working-directory: verification/lean
        run: |
          retry() { for attempt in 1 2 3 4 5; do "$@" && return 0; sleep $((attempt * 10)); done; return 1; }
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            retry curl --retry 5 --retry-all-errors -sSfL -o /tmp/elan-init.sh \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
            retry bash /tmp/elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          retry "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Build the specification
        working-directory: verification/lean
        run: lake build
      - name: Fixtures are exactly what the specification generates
        working-directory: verification/lean
        run: |
          lake exe conformance > ../conformance.json
          git diff --exit-code -- ../conformance.json

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --workspace --doc --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      # uv comes from PyPI and uses the runner's Python, so nothing is fetched
      # from GitHub releases.
      - name: MCP server with the official MCP Python SDK
        working-directory: crates/axionomy-mcp/interop
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: |
          pipx install uv==0.9.26
          cargo build -p axionomy-cli --bin axionomy
          uv run --locked pytest

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      # wasm-pack downloads binaryen on first use; keep it across runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-${{ runner.os }}-0.15.0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      # On a cold cache wasm-pack downloads binaryen from GitHub releases.
      - name: Build Studio
        working-directory: studio
        run: for attempt in 1 2 3; do pnpm build && exit 0; sleep $((attempt * 20)); done; exit 1
      - run: pnpm test:ui
        working-directory: studio
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: studio
      # Playwright gives `cargo run` two minutes to start the server, which a
      # cold build can take on its own; build it first so it only starts.
      - name: Build the server the end-to-end tests start
        run: cargo build -p axionomy-cli --bin axionomy
      - run: pnpm test:e2e
        working-directory: studio
      - run: pnpm test:e2e:wasm
        working-directory: studio
      # The Pages bundle reuses the WASM engine built above.
      - name: Build the Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: studio
        env:
          VITE_AXIONOMY_BASE: /axionomy/
          VITE_AXIONOMY_ENGINE: browser
        run: |
          pnpm build:ui
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/studies/catalog.json
          find dist/assets -name '*.wasm' -size +100k | grep -q .
          grep -q '/axionomy/' dist/index.html
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: studio/dist

  # Deploy only what passed every check.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [spec, rust, studio]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
